<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estudios de idiomas · Study Buddy</title>
  <meta name="description" content="Aprende noruego con pódcasts: transcripción línea a línea, traducción al español y un botón gigante de «No entendí».">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="home-page">
  <main class="home">
    <h1>Estudios de idiomas</h1>
    <p class="sub">Todos tus estudios, en un solo sitio. Elige un idioma y pulsa «No entendí» cuando te pierdas.</p>
    <div class="lang-filters" id="lang-filters" role="tablist" aria-label="Idioma"></div>
    <div id="episodes" aria-live="polite"><div class="empty">Cargando…</div></div>

    <form class="open" id="loader" autocomplete="off">
      <h2>Abrir otro audio</h2>
      <div class="row">
        <label for="src" class="sr-only">Enlace a un MP3 o a un feed RSS</label>
        <input id="src" type="url" inputmode="url" placeholder="https://… .mp3 o .rss" required>
        <button class="tbtn" type="submit">Abrir</button>
      </div>
      <p class="hint">Un MP3 se reproduce directamente (todavía sin transcripción). Muchos feeds RSS no se pueden leer desde el navegador.</p>
      <div id="loader-out"></div>
    </form>
  </main>
  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/index.js"></script>
</body>
</html>
